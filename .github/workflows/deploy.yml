name: Deploy to GitHub Pages

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Don't run when the workflow itself pushes (avoids infinite loop)
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: schedule-heatmap/package-lock.json

      - name: Install and build
        run: |
          cd schedule-heatmap
          npm ci
          npm run build

      - name: Deploy to docs folder
        run: |
          rm -rf docs
          mkdir docs
          cp -r schedule-heatmap/dist/* docs/

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/
          git diff --staged --quiet || (git commit -m "Deploy to GitHub Pages [skip ci]" && git push)
